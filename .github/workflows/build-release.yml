# Builds the APK on every push to master and publishes it as a GitHub Release.
# Generates a temporary release keystore if signing secrets are not configured,
# so the release APK is always signed and installable.
name: Build & Release APK

on:
  push:
    branches: [device-sync]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Inject version into build.gradle.kts ──────────────────────────
      # Versioning: the GitHub tag and APK versionName come EXACTLY from
      # versionName in app/build.gradle.kts (e.g. "0.4.2" → tag v0.4.2), so
      # releases and app version always match. versionCode stays tied to
      # run_number because Android requires a monotonically increasing
      # integer for in-place updates.
      - name: Compute version
        id: version
        run: |
          VERSION="$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION" ]; then
            echo "❌ Could not parse a MAJOR.MINOR.PATCH versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Fork releases: 1000 + run_number stays above the checked-in 1000 (local
          # builds) and above upstream's codes, so CI APKs always install as updates.
          CODE=$((1000 + ${{ github.run_number }}))
          sed -i "s/versionCode = .*/versionCode = ${CODE}/" app/build.gradle.kts
          echo "✅ tag=v${VERSION} versionCode=${CODE} (1000 + run_number)"

      # Released versions are immutable: a push that does not bump versionName
      # still builds (artifact below) but never replaces the published release,
      # so pinned sha256 sums (Ansible, DEVICES.md) stay valid. Bump versionName
      # in app/build.gradle.kts to publish.
      - name: Guard against republishing a released version
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${TAG} is already released; build only. Bump versionName to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Signing keystore ──────────────────────────────────────────────
      # If SIGNING_KEYSTORE_BASE64 secret is set, decode it into a real keystore.
      # Otherwise, generate a temporary self-signed keystore so the release APK
      # is always signed (installable on devices). The temp keystore is discarded
      # after the workflow run — it should NOT be used for Play Store uploads.
      - name: Set up signing keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "🔓 Using project signing keystore from secrets"
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > /tmp/romm-sync-release.jks
            cat > keystore.properties <<EOF
          storeFile=/tmp/romm-sync-release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF
          else
            echo "🔐 No signing secrets found — generating temporary keystore"
            keytool -genkeypair \
              -alias romm-sync \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -keystore /tmp/romm-sync-release.jks \
              -storepass rommsync \
              -keypass rommsync \
              -dname "CN=RomM Sync, OU=CI, O=davidrg, L=Madrid, ST=Madrid, C=ES"
            cat > keystore.properties <<EOF
          storeFile=/tmp/romm-sync-release.jks
          storePassword=rommsync
          keyAlias=romm-sync
          keyPassword=rommsync
          EOF
          fi
          echo "✅ keystore.properties created"

      # ── Build both debug and release ──────────────────────────────────
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Gradle always generates app-release.apk; we rename it to the same pattern
      # as the Linux AppImages (RomM-Sync-vX.Y.Z-<platform>.ext).
      - name: Rename APK to release pattern
        run: |
          cd app/build/outputs/apk/release
          APK="RomM-Sync-v${{ steps.version.outputs.version }}-android.apk"
          mv app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          ls -la

      - name: Upload Release APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: romm-sync-release
          path: app/build/outputs/apk/release/RomM-Sync-v${{ steps.version.outputs.version }}-android.apk

      # ── Create / update a release with the APK ────────────────────────
      - name: Create Release
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            **RomM Sync** – cross-platform build generated automatically

            **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ### 📦 Downloads

            | File | Platform |
            |---|---|
            | `RomM-Sync-v${{ steps.version.outputs.version }}-android.apk` | Android (R8 minified) |
            | `RomM-Sync-v${{ steps.version.outputs.version }}-linux-x86_64.AppImage` | Linux x86_64 (SteamOS, Steam Deck, most PCs) |
            | `RomM-Sync-v${{ steps.version.outputs.version }}-linux-aarch64.AppImage` | Linux ARM64 (Raspberry Pi 5, ARM handhelds) |

            ### 🔄 How to update

            - **Android:** Settings → Updates → *Check for updates*, or download the attached APK and open it — it installs over the previous version without losing data.
            - **Linux:** download the AppImage for your architecture, give it execute permission (`chmod +x`) and run it. Replaces the previous file.
          files: |
            app/build/outputs/apk/release/RomM-Sync-v${{ steps.version.outputs.version }}-android.apk
            app/build/outputs/apk/release/RomM-Sync-v${{ steps.version.outputs.version }}-android.apk.sha256
